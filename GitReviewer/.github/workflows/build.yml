name: Build Git Reviewer

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Windows application
        shell: pwsh
        run: ./GitReviewer/publish-win-x64.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GitReviewer-win-x64
          path: GitReviewer/dist/GitReviewer-*-win-x64.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0